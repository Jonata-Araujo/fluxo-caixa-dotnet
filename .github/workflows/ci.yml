name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CashFlow.sln

      - name: Build
        run: dotnet build CashFlow.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test CashFlow.sln -c Release --no-build --filter "FullyQualifiedName~UnitTests" --collect:"XPlat Code Coverage"

      # Runner do GitHub já tem Docker: Testcontainers sobe o PostgreSQL.
      - name: Integration tests
        run: dotnet test CashFlow.sln -c Release --no-build --filter "FullyQualifiedName~IntegrationTests"
